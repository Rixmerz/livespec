[project]
name = "livespec-mcp"
version = "0.24.0"
description = "Code intelligence for AI agents: call graph, impact analysis, and bidirectional Spec <-> code traceability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Diaz", email = "juanpablo516@gmail.com" }]
dependencies = [
    "fastmcp>=3,<4",
    "pydantic>=2.7",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.7,<1.6.3",
    "networkx>=3.2",
    "xxhash>=3.4",
    "watchdog>=4.0",
    "pathspec>=0.12",
    "tomli>=2 ; python_full_version < '3.11'",
]

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "psutil>=5.9",
]

[project.scripts]
# `livespec-mcp` is the historical console name (kept for back-compat: existing
# installs, `uvx livespec-mcp`, and MCP configs keep working). `livespec` is an
# additive alias so the command matches the product name. Both run the same
# entry point; the distribution name stays `livespec-mcp`.
livespec-mcp = "livespec_mcp.server:main"
livespec = "livespec_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livespec_mcp"]
# NOTE: templates/ ships automatically via `packages` (hatchling includes
# non-Python files under the package dir). Do NOT force-include it again —
# duplicate archive paths hard-fail the wheel build.

[tool.hatch.build.targets.wheel.force-include]
# The agent_playbook MCP prompt serves this file; docs/ is the single source
# of truth and wheels get a packaged copy readable via importlib.resources.
"docs/AGENT_PLAYBOOK.md" = "livespec_mcp/templates/AGENT_PLAYBOOK.md"

[tool.hatch.build.targets.sdist]
exclude = [".coverage", "*.png", ".mcp-docs*", ".playwright-mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "embeddings: tests that require the [embeddings] extras (fastembed + sqlite-vec); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
