<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>livespec</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" data-nav>livespec</a>
    <nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs"></ol></nav>
    <button type="button" class="ghost" id="theme" aria-pressed="false">Dark theme</button>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p class="notice">This page needs JavaScript to load the index data.</p></noscript>
  </main>
  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Forget project?</h2>
      <p id="confirm-body"></p>
      <div class="row end">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="danger" id="confirm-ok">Forget</button>
      </div>
    </form>
  </dialog>
</body>
</html>
