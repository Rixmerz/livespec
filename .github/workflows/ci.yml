name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    name: ruff + package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: ruff check
        run: uv run ruff check src tests
      - name: Build wheel + sdist (regression gate for packaging config)
        run: uv build
      - name: Verify wheel contents
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "livespec_mcp/storage/schema.sql",
              "livespec_mcp/templates/AGENT_PLAYBOOK.md",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel missing required data files: {missing}")
          print("wheel OK:", wheel)
          EOF

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Run tests
        run: uv run pytest -q
