name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    name: ruff + package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Create venv
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: ruff check
        run: uv run ruff check src tests
      # Formatting was unenforced and 129 of 170 files had drifted, so every
      # diff carried unrelated whitespace churn and every review paid for it.
      - name: ruff format --check
        run: uv run ruff format --check src tests scripts bench
      # CI installs with `uv pip install -e`, so nothing read uv.lock and it
      # silently fell behind pyproject. A stale lock breaks `uv run` for anyone
      # who does use it.
      - name: uv lock --check
        run: uv lock --check
      - name: Build wheel + sdist (regression gate for packaging config)
        run: uv build
      - name: Verify wheel contents
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "livespec_mcp/storage/schema.sql",
              "livespec_mcp/templates/AGENT_PLAYBOOK.md",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel missing required data files: {missing}")
          print("wheel OK:", wheel)
          EOF

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the current stable release; the floor stays at the
        # `requires-python` in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      # tree-sitter-language-pack 1.x downloads grammars on first use, and a
      # runner without them indexes Python and silently nothing else — which
      # would turn ~110 extractor tests red for a reason that has nothing to do
      # with the change under test. Prefetch explicitly and fail here, where
      # the message says what actually went wrong.
      - name: Prefetch tree-sitter grammars
        run: uv run livespec grammars
      - name: Run tests
        run: uv run pytest -q
